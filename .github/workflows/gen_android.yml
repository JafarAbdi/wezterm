name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          make android-provision
      - name: "Host dependencies"
        shell: bash
        run: "sudo apt-get update && sudo env CI=yes PATH=$PATH ./get-deps --testing"
      - name: "Host tests and doctests"
        shell: bash
        run: "cargo test --locked -p wezterm-android && cargo test --locked -p wezterm-android --doc"
      - name: "Parser controls"
        shell: bash
        run: "uv run --no-project python ci/test_android_instrument.py"
      - name: "Shipping checks"
        shell: bash
        run: "ci/android.sh check arm64-v8a release && ci/android.sh check x86_64 release"
  artifacts:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Signed release artifacts"
        shell: bash
        run: "make android-release"
      - name: "Retain release receipts and symbols"
        uses: actions/upload-artifact@v7
        with:
          name: "android-local-signed-release"
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/
            target/android-release/symbols/
            target/android-release/inspect/
            target/android-release/receipts/
          if-no-files-found: "error"
  api24:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Enable KVM"
        shell: bash
        run: "sudo chmod 666 /dev/kvm"
      - name: "Assemble and test an explicit emulator"
        env:
          WEZTERM_ANDROID_CONFIG_OVERRIDES: 'webgpu_preferred_adapter={name="Android Emulator OpenGL ES Translator (Google SwiftShader)",backend="Gl",device_type="Cpu"}'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-24;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --name android-ci-24 --package 'system-images;android-24;google_apis;x86_64'
          (exec "$ANDROID_HOME/emulator/emulator" -avd android-ci-24 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -port 5560 -cores 2 -memory 2560) > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          cleanup() { status=$?; kill "$pid" 2>/dev/null || true; wait "$pid" || true; exit "$status"; }
          trap cleanup EXIT
          # API24 logs boot-completed dispatch, API35 its completion; retained logs close the subscription race.
          timeout 600 bash -c 'adb -s "$1" wait-for-device && exec adb -s "$1" logcat -b system -v brief -s ActivityManager:D UserController:D -e "Sending BOOT_COMPLETE user #0|Finished processing BOOT_COMPLETED for u0" -m 1' _ emulator-5560
          test "$(adb -s emulator-5560 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5560 shell pm path android
          for suite in native-load; do make android-test SERIAL=emulator-5560 SUITE="$suite"; done
          adb -s emulator-5560 uninstall org.wezterm.android.test
          adb -s emulator-5560 uninstall org.wezterm.android
          make android-test SERIAL=emulator-5560 SUITE=release-load
      - name: "Retain literal emulator receipts"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "android-api24-receipts"
          path: |
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: "error"
  api35:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Enable KVM"
        shell: bash
        run: "sudo chmod 666 /dev/kvm"
      - name: "Assemble and test an explicit emulator"
        env:
          WEZTERM_ANDROID_CONFIG_OVERRIDES: 'webgpu_preferred_adapter={name="Android Emulator OpenGL ES Translator (Google SwiftShader)",backend="Gl",device_type="Cpu"}'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --name android-ci-35 --package 'system-images;android-35;google_apis;x86_64'
          (exec "$ANDROID_HOME/emulator/emulator" -avd android-ci-35 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -port 5558 -cores 2 -memory 2560) > "$RUNNER_TEMP/emulator.log" 2>&1 &
          pid=$!
          cleanup() { status=$?; kill "$pid" 2>/dev/null || true; wait "$pid" || true; exit "$status"; }
          trap cleanup EXIT
          # API24 logs boot-completed dispatch, API35 its completion; retained logs close the subscription race.
          timeout 600 bash -c 'adb -s "$1" wait-for-device && exec adb -s "$1" logcat -b system -v brief -s ActivityManager:D UserController:D -e "Sending BOOT_COMPLETE user #0|Finished processing BOOT_COMPLETED for u0" -m 1' _ emulator-5558
          test "$(adb -s emulator-5558 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5558 shell pm path android
          for suite in native-load surface lifecycle; do make android-test SERIAL=emulator-5558 SUITE="$suite"; done
          adb -s emulator-5558 uninstall org.wezterm.android.test
          adb -s emulator-5558 uninstall org.wezterm.android
          make android-test SERIAL=emulator-5558 SUITE=release-load
      - name: "Retain literal emulator receipts"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "android-api35-receipts"
          path: |
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: "error"
  android-success:
    runs-on: ubuntu-24.04
    if: always()
    needs: [checks, artifacts, api24, api35]
    steps:
      - name: Require every Android job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
