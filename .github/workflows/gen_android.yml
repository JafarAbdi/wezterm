          adb start-server > "$diag/adb-start-server.txt" 2>&1
          (exec "$ANDROID_HOME/emulator/emulator" -avd android-ci-35 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -port 5558 -cores 2 -memory 2560) > "$diag/emulator.log" 2>&1 &
          pid=$!
          printf '%s\n' "$pid" > "$diag/emulator.pid"
          (exec adb -s emulator-5558 logcat -b all -v threadtime) > "$diag/logcat.txt" 2>&1 &
