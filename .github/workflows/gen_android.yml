name: Android
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          make android-provision
      - name: "Host dependencies"
        shell: bash
        run: "sudo apt-get update && CI=yes ./get-deps --testing"
      - name: "Host tests and doctests"
        shell: bash
        run: "cargo test --locked -p wezterm-android && cargo test --locked -p wezterm-android --doc"
      - name: "Parser controls"
        shell: bash
        run: "uv run --no-project python ci/test_android_instrument.py"
      - name: "Shipping checks"
        shell: bash
        run: "ci/android.sh check arm64-v8a release && ci/android.sh check x86_64 release"
  artifacts:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Signed release artifacts"
        shell: bash
        run: "make android-release"
      - name: "Retain release receipts and symbols"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "android-local-signed-release"
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/
            target/android-release/jniLibs/
            target/android-release/symbols/
            target/android-release/inspect/
            target/android-release/receipts/
            target/android-notices/assets/notices/
          if-no-files-found: "error"
  api24:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Emulator host dependencies and KVM"
        shell: bash
        run: "sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0 && sudo chmod 666 /dev/kvm"
      - name: "Assemble and test an explicit emulator"
        env:
          WEZTERM_ANDROID_CONFIG_OVERRIDES: 'webgpu_preferred_adapter={name="Android Emulator OpenGL ES Translator (Google SwiftShader)",backend="Gl",device_type="Cpu"}'
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/wezterm-emu/diagnostics"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/wezterm-emu/avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/wezterm-emu/user"
          mkdir -p "$diag" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          pid= logcat_pid=
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            printf '%s\n' "$status" > "$diag/step.exit"
            if [ -n "$pid" ]; then
              ps -p "$pid" -o pid,ppid,args > "$diag/emulator-process.txt" 2>&1
              # Empirical 30s snapshot budget; not another boot wait or readiness check.
              timeout 30 adb -s emulator-5560 get-state > "$diag/transport-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/transport-final.exit"
              timeout 30 adb -s emulator-5560 shell getprop sys.boot_completed > "$diag/boot-status-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/boot-status-final.exit"
              timeout 30 adb -s emulator-5560 logcat -b all -d -v threadtime > "$diag/logcat-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/logcat-final.exit"
            fi
            if [ -n "$logcat_pid" ]; then
              kill "$logcat_pid" 2>/dev/null
              wait "$logcat_pid"
              printf '%s\n' "$?" > "$diag/logcat.exit"
            fi
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null
              wait "$pid"
              printf '%s\n' "$?" > "$diag/emulator.exit"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' HUP TERM
          printf 'serial=emulator-5560\nANDROID_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_HOME" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" > "$diag/owner.txt"
          sdkmanager 'emulator' 'system-images;android-24;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version > "$diag/emulator-version.txt" 2>&1
          cp "$ANDROID_HOME/emulator/source.properties" "$diag/emulator-source.properties"
          cp "$ANDROID_HOME/system-images/android-24/google_apis/x86_64/source.properties" "$diag/image-source.properties"
          printf 'no\n' | avdmanager create avd --name android-ci-24 --path "$ANDROID_AVD_HOME/android-ci-24.avd" --package 'system-images;android-24;google_apis;x86_64' > "$diag/avd-create.txt" 2>&1
          # Both tools must use the same index; fail before launch if creation did not publish it.
          test -f "$ANDROID_AVD_HOME/android-ci-24.ini"
          cp "$ANDROID_AVD_HOME/android-ci-24.ini" "$diag/avd.ini"
          cp "$ANDROID_AVD_HOME/android-ci-24.avd/config.ini" "$diag/avd-config.ini"
          # Start synchronously and override inherited tracing: transport tracing includes payload previews.
          export ADB_TRACE=
          adb start-server > "$diag/adb-start-server.txt" 2>&1
          (exec "$ANDROID_HOME/emulator/emulator" -avd android-ci-24 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -port 5560 -cores 2 -memory 2560) > "$diag/emulator.log" 2>&1 &
          pid=$!
          printf '%s\n' "$pid" > "$diag/emulator.pid"
          (exec adb -s emulator-5560 logcat -b all -v threadtime) > "$diag/logcat.txt" 2>&1 &
          logcat_pid=$!
          printf '%s\n' "$logcat_pid" > "$diag/logcat.pid"
          # API24 logs boot-completed dispatch, API35 its completion; retained logs close the subscription race.
          boot_status=0
          timeout 600 bash -c 'adb -s "$1" wait-for-device && exec adb -s "$1" logcat -b system -v brief -s ActivityManager:D UserController:D -e "Sending BOOT_COMPLETE user #0|Finished processing BOOT_COMPLETED for u0" -m 1' _ emulator-5560 > "$diag/boot-event.txt" 2>&1 || boot_status=$?
          printf '%s\n' "$boot_status" > "$diag/boot-wait.exit"
          [ "$boot_status" = 0 ] || exit "$boot_status"
          adb -s emulator-5560 shell getprop sys.boot_completed > "$diag/boot-status.txt"
          test "$(tr -d '\r' < "$diag/boot-status.txt")" = 1
          adb -s emulator-5560 shell pm path android > "$diag/package-manager.txt"
          for suite in native-load; do make android-test SERIAL=emulator-5560 SUITE="$suite"; done
          adb -s emulator-5560 uninstall org.wezterm.android.test
          adb -s emulator-5560 uninstall org.wezterm.android
          make android-test SERIAL=emulator-5560 SUITE=release-load
      - name: "Retain literal emulator receipts"
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: "android-api24-receipts"
          path: |
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/wezterm-emu/diagnostics/
            android/app/build/outputs/apk/release/*.apk
            target/android-release/jniLibs/
            target/android-release/inspect/
          if-no-files-found: "error"
  api35:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.98.0'

    steps:
      - name: "checkout repo"
        uses: actions/checkout@v5
        with:
          submodules: "recursive"
      - name: "Set up uv"
        uses: astral-sh/setup-uv@v6
      - name: "Set up Android SDK"
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: "Provision pinned Android inputs"
        shell: bash
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          make android-provision
      - name: "Create throwaway CI signing identity"
        shell: bash
        run: |
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")
          openssl rand -base64 48 > "$keydir/password"
          "$HOME/.local/share/wezterm-android-toolchain/jdk-17.0.20.1+1/bin/keytool" -genkeypair -storetype PKCS12 -keystore "$keydir/ci.p12" -alias ci -storepass:file "$keydir/password" -keypass:file "$keydir/password" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=Throwaway Android CI,OU=Not release authority'
          chmod 600 "$keydir/ci.p12"
          printf 'WEZTERM_ANDROID_KEYSTORE=%s\nWEZTERM_ANDROID_KEY_ALIAS=ci\nWEZTERM_ANDROID_STORE_PASSWORD_FILE=%s\nWEZTERM_ANDROID_KEY_PASSWORD_FILE=%s\n' "$keydir/ci.p12" "$keydir/password" "$keydir/password" >> "$GITHUB_ENV"
      - name: "Emulator host dependencies and KVM"
        shell: bash
        run: "sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0 && sudo chmod 666 /dev/kvm"
      - name: "Assemble and test an explicit emulator"
        env:
          WEZTERM_ANDROID_CONFIG_OVERRIDES: 'webgpu_preferred_adapter={name="Android Emulator OpenGL ES Translator (Google SwiftShader)",backend="Gl",device_type="Cpu"}'
        shell: bash
        run: |
          set -euo pipefail
          diag="$RUNNER_TEMP/wezterm-emu/diagnostics"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/wezterm-emu/avd"
          export ANDROID_USER_HOME="$RUNNER_TEMP/wezterm-emu/user"
          mkdir -p "$diag" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          pid= logcat_pid=
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            printf '%s\n' "$status" > "$diag/step.exit"
            if [ -n "$pid" ]; then
              ps -p "$pid" -o pid,ppid,args > "$diag/emulator-process.txt" 2>&1
              # Empirical 30s snapshot budget; not another boot wait or readiness check.
              timeout 30 adb -s emulator-5558 get-state > "$diag/transport-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/transport-final.exit"
              timeout 30 adb -s emulator-5558 shell getprop sys.boot_completed > "$diag/boot-status-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/boot-status-final.exit"
              timeout 30 adb -s emulator-5558 logcat -b all -d -v threadtime > "$diag/logcat-final.txt" 2>&1
              printf '%s\n' "$?" > "$diag/logcat-final.exit"
            fi
            if [ -n "$logcat_pid" ]; then
              kill "$logcat_pid" 2>/dev/null
              wait "$logcat_pid"
              printf '%s\n' "$?" > "$diag/logcat.exit"
            fi
            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null
              wait "$pid"
              printf '%s\n' "$?" > "$diag/emulator.exit"
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' HUP TERM
          printf 'serial=emulator-5558\nANDROID_HOME=%s\nANDROID_AVD_HOME=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_HOME" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" > "$diag/owner.txt"
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version > "$diag/emulator-version.txt" 2>&1
          cp "$ANDROID_HOME/emulator/source.properties" "$diag/emulator-source.properties"
          cp "$ANDROID_HOME/system-images/android-35/google_apis/x86_64/source.properties" "$diag/image-source.properties"
          printf 'no\n' | avdmanager create avd --name android-ci-35 --path "$ANDROID_AVD_HOME/android-ci-35.avd" --package 'system-images;android-35;google_apis;x86_64' > "$diag/avd-create.txt" 2>&1
          # Both tools must use the same index; fail before launch if creation did not publish it.
          test -f "$ANDROID_AVD_HOME/android-ci-35.ini"
          cp "$ANDROID_AVD_HOME/android-ci-35.ini" "$diag/avd.ini"
          cp "$ANDROID_AVD_HOME/android-ci-35.avd/config.ini" "$diag/avd-config.ini"
          # Start synchronously and override inherited tracing: transport tracing includes payload previews.
